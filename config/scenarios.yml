# فاز ۴ — تعریف اعلانی سناریوها (CLAUDE.md §۶: «config/scenarios.yml تعریف
# اعلانی سناریوها»). src/04_run_experiments.py و src/05_extract_kpis.py این
# فایل را می‌خوانند تا بدانند کدام سناریو/نسخهٔ کنترلی را با چند-λ×چند-seed
# اجرا/تحلیل کنند. status: built یعنی شبکه/سناریو ساخته و آمادهٔ اجراست؛
# status: planned یعنی فقط طراحی مفهومی ثبت شده (README سناریو) و هنوز ساخته
# نشده — رجوع به فاز ۴ بندهای بعدی CLAUDE.md.

scenarios:
  S0_baseline:
    label_fa: "حفظ وضع موجود (Do-Nothing)"
    label_en: "Do-Nothing baseline"
    status: built
    is_reference: true
    net_file_shared: "network/seyedi.net.xml"
    control_variants:
      default:
        label_fa: "بدون کنترل (priority/right_before_left + zipper در نقاط ادغام)"
        net_file: "network/seyedi.net.xml"
        out_dir: "scenarios/S0_baseline/out"
        table_prefix: "s0"

  S1_signal:
    label_fa: "تبدیل به تقاطع چراغ‌دار"
    label_en: "Signalized intersection"
    status: built
    design_note: >
      زیر پل به یک تقاطع واحد تبدیل نمی‌شود (رجوع به assumptions.yml ->
      signal_design_S1 برای توجیه کامل) — هر گرهٔ ادغام واقعی (in-degree>=۲)
      درون میدانچهٔ ویوینگ به‌طور مستقل چراغ‌دار می‌شود؛ طول سیکل مشترک با
      روش وبستر (src/08_webster_timing.py) برای تقاضای طراحی λ=۱.۰ محاسبه و
      در نسخهٔ «ثابت» بدون تغییر روی همهٔ λها اعمال می‌شود؛ نسخهٔ «actuated»
      خودکار با تقاضا تطبیق می‌یابد. بررسی کفایت فضای زیر پل برای صف و خطر
      سرریز صف به رمپ‌ها (بند صریح CLAUDE.md) در src/06_statistics.py با
      شاخص طول صف/۹۵ام‌صدک ارزیابی می‌شود.
    control_variants:
      fixed:
        label_fa: "زمان‌ثابت (وبستر @ λ=۱.۰)"
        net_file: "scenarios/S1_signal/network/seyedi_S1_fixed.net.xml"
        out_dir: "scenarios/S1_signal/out/fixed"
        table_prefix: "s1_fixed"
      actuated:
        label_fa: "actuated (پیش‌فرض SUMO gap-out)"
        net_file: "scenarios/S1_signal/network/seyedi_S1_actuated.net.xml"
        out_dir: "scenarios/S1_signal/out/actuated"
        table_prefix: "s1_actuated"

  S2_rcut:
    label_fa: "محدودسازی گردش‌ها + دوربرگردان فیزیکی (RCUT/Median U-Turn)"
    label_en: "Restricted Crossing U-Turn / Median U-Turn — v2 (physical crossovers)"
    status: built
    design_note: >
      نسخهٔ ۲ (کامل): هر ۵ اتصال گردش چپ واقعی زیر پل حذف شده‌اند؛ علاوه‌براین
      دو یال بلند عرشه (شرق‌گرد ۴۱۰۲۴۷۴۹۲ و غرب‌گرد ۶۲۷۰۰۸۱۹۲) هرکدام با
      درون‌یابی طول‌کمانی روی شکل واقعی یال در دو نقطه (±D متر از مرکز
      میدانچهٔ ویوینگ) شکافته و یک یال دوربرگردان کوتاه در هر نقطه افزوده شده
      (رجوع به scenarios/S2_rcut/build_network.py). طبق CLAUDE.md، D به‌عنوان
      متغیر حساسیت در سه سطح ۱۵۰/۲۵۰/۳۵۰ متر ساخته شده؛ سناریوی «built»
      رسمی از D=۲۵۰ (مبنا) استفاده می‌کند؛ ۱۵۰ و ۳۵۰ برای تحلیل حساسیت آماده‌اند
      (net فایل‌های seyedi_S2_D150.net.xml و seyedi_S2_D350.net.xml).
      تقاضا با مکانیزم عمومی `demand_extra_turn_rules` در src/03_build_demand.py
      هدایت می‌شود: در هر نقطهٔ دوربرگردان، سهمی برابر با
      traffic_control.turn_ratio_baseline.left (۱۵٪) از ترافیک عبوری واقعاً
      دوربرگردان می‌زند و مسیر «عبور از تقاطع → دوربرگردان → بازگشت →
      گردش راست» را طی می‌کند — نه فقط بازتوزیع مقصد در سطح تقاضا.
    demand_blocked_edges:
      - "643263251"
      - "713864643"
      - "627633586"
      - "643263250"
      - "683662933"
    demand_extra_turn_rules:
      - from: "410247492_mid"
        options:
          - {to: "410247492_east", weight: 85}
          - {to: "s2_uturn_east", weight: 15}
      - from: "627008192_mid"
        options:
          - {to: "627008192_west", weight: 85}
          - {to: "s2_uturn_west", weight: 15}
    control_variants:
      d150:
        label_fa: "دوربرگردان در D=۱۵۰ متر از مرکز (حساسیت)"
        net_file: "scenarios/S2_rcut/network/seyedi_S2_D150.net.xml"
        out_dir: "scenarios/S2_rcut/out/D150"
        table_prefix: "s2_d150"
      default:
        label_fa: "دوربرگردان در D=۲۵۰ متر از مرکز (مبنا)"
        net_file: "scenarios/S2_rcut/network/seyedi_S2_D250.net.xml"
        out_dir: "scenarios/S2_rcut/out/D250"
        table_prefix: "s2"
      d350:
        label_fa: "دوربرگردان در D=۳۵۰ متر از مرکز (حساسیت)"
        net_file: "scenarios/S2_rcut/network/seyedi_S2_D350.net.xml"
        out_dir: "scenarios/S2_rcut/out/D350"
        table_prefix: "s2_d350"

  S3_roundabout:
    label_fa: "میدان نامتقارن (دو گزینه: محدود به دهانه‌های باز / با دهانهٔ مرکزی باز)"
    label_en: "Asymmetric mini-roundabout — constrained (2 open spans) vs. full (center span open)"
    status: built
    design_note: >
      طبق Checkpoint کاربر (۱۴۰۵/۰۶/۲۳)، هر دو گزینه ساخته شد. یک حلقهٔ
      گردشی پادساعتگرد تک‌خطهٔ ۴یالی (با شکل کمانی حول مرکز میدانچه، نه خط
      راست) میان چهار گرهٔ تلاقی واقعی موجود (شمال/غرب/جنوب/شرق — نزدیک‌ترین
      گره‌های واقعی به دو دهانهٔ باز) افزوده شده، **بدون حذف** هیچ گره/یال
      قبلی (کم‌ریسک‌ترین گزینه، چون زیر پل یک گرهٔ تقاطعی واحد برای ادغام
      کامل ندارد — همان یافتهٔ S1). یال‌های حلقه priority عددی بالا و
      pass="true" می‌گیرند (حق‌تقدم گردشی بدون قیدوشرط، دقیقاً رفتار واقعی
      میدان). **تجربهٔ ساخت:** حلقهٔ دوخطه آزموده شد اما برخورد را افزایش
      داد (تراکم لاتِرال بیشتر در یک میدان کوچک)؛ تک‌خطه + شکل کمانی بهترین
      نتیجه را داد (رجوع به scenarios/S3_roundabout/README.md برای جزئیات
      این آزمایش). نسخهٔ full یک وتر مستقیم غرب-شرق اضافه دارد که فرضاً از
      دهانهٔ مرکزیِ بازشده عبور می‌کند (مشروط به تأیید سازه‌ای، خارج از
      حیطهٔ این مطالعه).
    control_variants:
      constrained:
        label_fa: "میدان محدود به دو دهانهٔ باز موجود"
        net_file: "scenarios/S3_roundabout/network/seyedi_S3_constrained.net.xml"
        out_dir: "scenarios/S3_roundabout/out/constrained"
        table_prefix: "s3_constrained"
      full:
        label_fa: "میدان کامل با دهانهٔ مرکزی باز (مشروط به تأیید سازه‌ای)"
        net_file: "scenarios/S3_roundabout/network/seyedi_S3_full.net.xml"
        out_dir: "scenarios/S3_roundabout/out/full"
        table_prefix: "s3_full"

  S4_channelization:
    label_fa: "کانالیزاسیون + گردش راست آزاد"
    label_en: "Channelization + free right-turn"
    status: built
    design_note: >
      هر ۵ گرهٔ ادغام واقعی زیر پل از zipper به priority بازگردانده شده‌اند؛
      اتصال عبوریِ اصلی هر گره pass="true" گرفته (حق‌تقدم بدون قیدوشرط، طبق
      قرارداد متعارف مسیر اصلی)، گردش راست کانالیزه‌شده minor/yield شفاف
      می‌ماند (به‌جای مذاکرهٔ مبهم zipper قبلی). حذف پارک حاشیه‌ای در مدل پایه
      اصلاً لحاظ نشده بود، پس اثر شبکه‌ای ندارد (فقط یادداشت کیفی).
    control_variants:
      default:
        label_fa: "کانالیزاسیون گردش راست (۵ نقطهٔ تعارض واقعی)"
        net_file: "scenarios/S4_channelization/network/seyedi_S4.net.xml"
        out_dir: "scenarios/S4_channelization/out"
        table_prefix: "s4"

  S5_hybrid:
    label_fa: "ترکیبی/خلاقانه (دو گزینهٔ ابتکاری، هرکدام مبتنی بر حلقهٔ S3)"
    label_en: "Hybrid / creative — both built on the S3 ring infrastructure"
    status: built
    design_note: >
      از سه ایدهٔ ثبت‌شده در README این سناریو، دو ایده ساخته شد (ایدهٔ سوم —
      بازکردن دهانهٔ مرکزی برای گردش‌های سبک — با S3-full هم‌پوشانی مفهومی
      دارد و به نسخهٔ بعدی موکول شد). هر دو روی همان زیرساخت حلقهٔ گردشی
      S3-constrained (تک‌خطه، کمانی) ساخته شده‌اند:
      **metering** — همان حلقه + چراغ متردهندهٔ تک‌گرهی روی پای غرب (دریافت‌کنندهٔ
      ترافیک گردشی از عرشهٔ پرتردد)، سیکل کوتاه (۲۰ ثانیه، نه سیکل کامل
      وبستر S1).
      **oneway_priority** — همان حلقه + یک بای‌پس مستقیم دوطرفهٔ شمال-جنوب با
      اولویت حتی بالاتر از خودِ حلقه، برای عبور مستقیم بلوار سیدی بدون ورود
      به چرخهٔ گردشی — برخلاف وترِ S3-full، این بای‌پس نیازی به بازشدن دهانهٔ
      مرکزی ندارد (بلوار سیدی همین حالا هم‌سطح عبور می‌کند). نشست ۴: تداخل
      هندسی مستندش (هشدار netconvert) رفع شد اما نتیجه بهبود نیافت — رجوع
      به بخش ۷ گزارش. **oneway_yield** (نشست ۵) — همان بای‌پس، اما با
      حق‌تقدم عادی (priority=30 زیر ۵۰ حلقه، بدون pass بدون‌قیدوشرط) به‌جای
      حق‌تقدم بدون‌قیدوشرط — آزمون مستقیم فرضیهٔ «کنترل فعال/حذف حق‌تقدم
      بدون‌قیدوشرط، نه صرفاً هندسه، لازم است».
      رجوع به scenarios/S5_hybrid/README.md برای جزئیات و محدودیت‌های این
      نسخه‌ها.
    control_variants:
      metering:
        label_fa: "میدان + چراغ متردهنده روی پای غالب"
        net_file: "scenarios/S5_hybrid/network/seyedi_S5_metering.net.xml"
        out_dir: "scenarios/S5_hybrid/out/metering"
        table_prefix: "s5_metering"
      oneway_priority:
        label_fa: "میدان + بای‌پس اولویت‌دار شمال-جنوب (حق‌تقدم بدون‌قیدوشرط)"
        net_file: "scenarios/S5_hybrid/network/seyedi_S5_oneway.net.xml"
        out_dir: "scenarios/S5_hybrid/out/oneway"
        table_prefix: "s5_oneway"
      oneway_yield:
        label_fa: "میدان + بای‌پس شمال-جنوب (حق‌تقدم عادی/یالدهنده)"
        net_file: "scenarios/S5_hybrid/network/seyedi_S5_oneway_yield.net.xml"
        out_dir: "scenarios/S5_hybrid/out/oneway_yield"
        table_prefix: "s5_oneway_yield"

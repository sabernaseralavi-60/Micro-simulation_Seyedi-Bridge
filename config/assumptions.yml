signal_design_S5_bypass:
  note: "فاز ۴، تلاش سوم برای گرهٔ ۶۷۱۱۵۰۹۱۷۶ (جنوب، تعارض بای‌پس شمال-جنوب
    S5 با حلقهٔ S3) — پس از دو رفع ناموفق (شعاع تقاطع، سپس کاهش اولویت؛
    رجوع به scenario_design_S5)، این نسخه یک **چراغ راهنمایی واقعی** روی
    همان گره می‌گذارد: گره به traffic_light بازتایپ می‌شود و سیکل آن با
    همان روش وبستر src/08_webster_timing.py::compute_cycle محاسبه می‌شود —
    اما با ظرفیت/تقاضای مخصوص همین گرهٔ کوچک‌تر (نه سیکل ۴۱.۹ثانیه‌ای S1
    که برای زیرپل کامل ۲خطه محاسبه شده بود). زمان‌بندی نهایی (سبز وزن‌دار
    + همه‌قرمز واقعی) با همان src/10_signal_design.py اعمال می‌شود که برای
    S1 هم استفاده شد.
    **نتیجهٔ صادقانه:** برخلاف انتظار، چراغ واقعی بدترین گزینهٔ سه‌گانهٔ
    این گره شد، نه بهترین — در λ=۱.۴، تأخیر ۸۷.۸ثانیه و ۳۲۵۷.۶ برخورد/اجرا
    (بیشتر از بدترین حالت S1: ۱۶۰۹.۷). توضیح محتمل: آزادسازی دوره‌ای صف
    (platoon release) چراغ، در تعامل با رفتار تهاجمی کالیبره‌نشده این
    مطالعه، تصادم عقب‌به‌جلو/فیلترینگ را نسبت به مذاکرهٔ پیوستهٔ
    priority/yield افزایش می‌دهد — همان مکانیزم S1، اکنون در گرهٔ مستقل
    دیگری بازتولید شده. رجوع به scenarios/S5_hybrid/README.md و گزارش

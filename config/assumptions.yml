  note: "فاز ۴ — طراحی سناریوی S1 (تقاطع چراغ‌دار). تصمیم مهندسی صریح (ثبت‌شده
    پس از بررسی توپولوژی شبکه با کاربر، ۱۴۰۵/۰۶/۲۳): زیر پل هیچ گرهٔ تقاطعی
    واقعی (≥۲ ورودی و ≥۲ خروجی هم‌زمان) ندارد — OSM آن را به زنجیره‌ای از
    گره‌های رمپ/ادغام/انشعاب مجزا تجزیه کرده (دقیقاً هم‌سو با توصیف فاز ۰:
    «شبه‌میدان بدون کانالیزاسیون»). به‌جای ادغام توپولوژیک پرریسک این گره‌ها به
    یک تقاطع مصنوعی واحد، یا یک برنامهٔ TLS مشترک (joined) روی زنجیره‌ای
    ۱۵۰متری از نقاط ادغام غیرهم‌زمان (که رفتار هماهنگ‌سازی/افست را به‌درستی
    مدل نمی‌کند)، **هر گرهٔ ادغام واقعی (in-degree≥۲) درون شعاع میدانچهٔ
    ویوینگ به‌طور مستقل چراغ‌دار می‌شود** — هرکدام با tl id مجزا و برنامهٔ
    پیش‌فرض ۲فازهٔ خودکار netconvert. طول سیکل مشترک با روش وبستر (بر مبنای
    تقاضای طراحی λ=۱.۰) محاسبه و روی همهٔ گره‌ها یکسان اعمال می‌شود
    (--tls.cycle.time)؛ توزیع سبز داخل هر گره به هیوریستیک پیش‌فرض netconvert
    (متناسب با تعداد حرکات/خطوط آن گره) واگذار می‌شود چون داده‌ای برای تفکیک
    نسبت جریان بحرانی به ازای هر گرهٔ منفرد نداریم. این ساده‌سازی صریح است، نه
    حدس پنهان."

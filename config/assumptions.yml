# ثبت تمام فرض‌های ورودی مدل — فاز ۰
# قواعد پر کردن (CLAUDE.md §3.3):
#   value, unit, source (observed|osm|imagery|engineering_judgement|literature),
#   range_low, range_high, sensitivity (true|false)
#
# این فایل به‌مرور در فازهای ۱ تا ۴ تکمیل می‌شود. فیلدهای فاز ۰ فقط هندسه و bbox را پوشش می‌دهند.

study_area:
  intersection_name: "تقاطع زیرپل سیدی (بلوار سیدی × بزرگراه امام‌رضا)، کرمان"
  center_lon:
    value: 57.0850
    unit: degree_WGS84
    source: imagery
    range_low: 57.0830
    range_high: 57.0870
    sensitivity: true
    note: "میانگین مختصات نشانگر ماوس در ۵ اسکرین‌شات Google Earth؛ نیاز به راستی‌آزمایی با OSM/GPS میدانی."
  center_lat:
    value: 30.3165
    unit: degree_WGS84
    source: imagery
    range_low: 30.3155
    range_high: 30.3180
    sensitivity: true
    note: "همان منبع center_lon."
  bbox_half_extent:
    value: 400
    unit: meter
    source: engineering_judgement
    range_low: 400
    range_high: 600
    sensitivity: false
    note: "حداقل ۴۰۰ متر طبق قاعدهٔ CLAUDE.md فاز۰ برای جلوگیری از اثر لبه روی صف‌ها."

bridge_geometry:
  deck_orientation:
    value: "east_west"
    unit: categorical
    source: imagery
    range_low: null
    range_high: null
    sensitivity: false
    note: "بزرگراه امام رضا روی عرشه؛ منطبق با نام‌گذاری Google Maps."
  deck_lanes_per_direction:
    value: 3
    unit: count
    source: imagery
    range_low: 2
    range_high: 3
    sensitivity: true
    note: "برآورد چشمی از 2025_zoom.png؛ فاقد شمارش دقیق پیکسلی. **فاز ۲:** OSM
      این یال را ۲ خط در هر جهت ثبت کرده بود (source: osm) — پس از بازبینی
      دقیق‌تر 2025_zoom.png (ردیف خودروها به‌وضوح ۳تایی)، با اسکریپت
      src/02_patch_geometry.py روی plain-XML به ۳ خط اصلاح شد. این دقیقاً همان
      «فرض صریح + اصلاح برنامه‌نویسی‌شده به‌جای حدس پنهان یا ویرایش دستی
      netedit» است که قاعدهٔ سخت ۲ پروژه می‌خواهد."
  underpass_orientation:
    value: "north_south"
    unit: categorical
    source: imagery
    range_low: null
    range_high: null
    sensitivity: false
  underpass_lanes_per_direction:
    value: 2
    unit: count
    source: imagery
    range_low: 1
    range_high: 2
    sensitivity: true
    note: "بلوار سیدی زیر پل، برآورد چشمی از 2017.png و 2025_zoom.png."
  span_width_between_abutments:
    value: 26
    unit: meter
    source: imagery
    range_low: 20
    range_high: 32
    sensitivity: true
    note: "برآورد پیکسلی از سایهٔ عرشه در 2025_zoom.png، غیرمتریک — نیازمند راستی‌آزمایی OSM/میدانی."
  loop_ramp_radius_nw:
    value: 30
    unit: meter
    source: imagery
    range_low: 20
    range_high: 40
    sensitivity: true
    note: "رمپ حلقوی شمال‌غربی، برآورد چشمی نسبت به عرض خط (۳.۵ متر)."
  loop_ramp_radius_ne:
    value: 30
    unit: meter
    source: imagery
    range_low: 20
    range_high: 40
    sensitivity: true
  weave_area_south_radius:
    value: 22
    unit: meter
    source: imagery
    range_low: 15
    range_high: 30
    sensitivity: true
    note: "انحنای جنوبی حول جزیرهٔ قطره‌ای، زیر پل."
  pier_offset_from_carriageway_edge:
    value: 1.5
    unit: meter
    source: engineering_judgement
    range_low: 0.5
    range_high: 3.0
    sensitivity: true
    note: "پایه‌ها در هیچ تصویری با قطعیت بالا دیده نمی‌شوند؛ فرض مهندسی استاندارد برای عرض ایمنی حاشیهٔ پایه از لبهٔ سواره‌رو هم‌سطح."

  span_structure:
    value:
      total_spans: 7
      layout_west_to_east: ["closed", "closed", "open", "closed_center", "open", "closed", "closed"]
      spans_per_side: 3
      open_spans_per_side: 1
      open_span_position: "نزدیک‌ترین دهانه به مرکز، از هر سمت"
      closed_span_role: "جزو بدنهٔ سازه‌ای پل (دیوارهٔ توپر/کوله)، نه فضای قابل‌عبور"
      center_span_status_baseline: "بسته (عمدی)"
    unit: categorical
    source: observed
    range_low: null
    range_high: null
    sensitivity: true
    note: "تأیید مستقیم کاربر با بازرسی دقیق data/raw/imagery/2012.png (۱۴۰۵/۰۶/۲۲):
      پایه‌های پل کاملاً مشخص‌اند. زیر پل در طول محور شرقی-غربی به ۷ دهانه
      تقسیم می‌شود: ۳ دهانه در سمت غرب + ۱ دهانهٔ مرکزی + ۳ دهانه در سمت شرق.
      از سه دهانهٔ هر سمت، فقط دهانهٔ مجاور مرکز به روی ترافیک باز است و محل
      واقعی عبور/گردش خودروهاست؛ دو دهانهٔ انتهاییِ هر سمت کاملاً بسته و بخشی
      از بدنهٔ سازه‌ای پل‌اند (نه فضای خالی قابل‌استفاده). دهانهٔ مرکزی در وضع
      موجود عمداً بسته نگه داشته شده. **پیامد مدل‌سازی:** ناحیهٔ ویوینگ زیر پل
      در واقعیت یک میدانچهٔ باز پیوسته نیست، بلکه دقیقاً دو گلوگاه گسسته
      (دهانهٔ باز غربی + دهانهٔ باز شرقی) با یک بستر بستهٔ سازه‌ای بین آن‌هاست؛
      رفتار شبه‌میدانی فعلی از وِیوینگ خودروها بین همین دو گلوگاه ناشی می‌شود،
      نه از یک فضای باز یکپارچه. **پیامد سناریو:** باز کردن دهانهٔ مرکزی
      (به شرط تأیید ظرفیت باربری سازه توسط مهندس سازه — خارج از محدودهٔ این
      مطالعهٔ ترافیکی) یک گزینهٔ صریح برای فاز ۴ (سناریوی S3 میدان مدرن یا
      یکی از دو ایدهٔ خلاقانهٔ S5) است که مسیر سوم عبوری زیر پل را می‌گشاید.
      هندسهٔ SUMO (شبکه + اسکچ) باید همیشه با این محدودیت فیزیکی سازگار
      بماند: هیچ لِین/یال قابل‌عبوری نباید از دل دهانه‌های بسته عبور کند."

  open_span_width:
    value: 18
    unit: meter
    source: engineering_judgement
    range_low: 12
    range_high: 24
    sensitivity: true
    note: "عرض شماتیک هر دهانهٔ باز (در امتداد محور شرقی-غربی پل) — فاقد
      اندازه‌گیری میدانی؛ فقط برای اسکچ فاز ۰-۲. باید با فاصلهٔ واقعی پایه‌ها
      (نقشهٔ as-built یا برداشت میدانی) جایگزین شود."
  closed_span_width:
    value: 14
    unit: meter
    source: engineering_judgement
    range_low: 10
    range_high: 20
    sensitivity: true
    note: "عرض شماتیک هر دهانهٔ بستهٔ جانبی/مرکزی — همان محدودیت open_span_width را دارد."

traffic_control:
  weave_merge_junction_model:
    value: "zipper"
    unit: categorical
    source: engineering_judgement
    range_low: null
    range_high: null
    sensitivity: true
    note: "فاز ۲: تقاطع‌های ادغام (۲ ورودی/۱ خروجی) درون شعاع ۱۲۰ متری مرکز
      میدانچهٔ ویوینگ زیر پل، از priority (پیش‌فرض netconvert بر مبنای رتبهٔ
      کلاس راه) به zipper تغییر یافتند — طبق توصیهٔ صریح CLAUDE.md برای
      نمایش رفتار واقعی «هر که زودتر رسید» در نبود کانالیزاسیون/چراغ. اعمال
      شده در src/02_patch_geometry.py (۹ تقاطع). حساسیت: نوع junction model
      می‌تواند به‌طور محسوسی روی تأخیر و SSM اثر بگذارد؛ در فاز ۳ به‌عنوان
      متغیر حساسیت کاندید (priority در برابر zipper در برابر right_before_left)
      آزمایش شود."
  turn_ratio_baseline:
    value: {through: 70, right: 15, left: 15}
    unit: percent
    source: engineering_judgement
    range_low: null
    range_high: null
    sensitivity: true
    note: "نسبت گردش پیش‌فرض فاز ۱ (Walking Skeleton)، صرفاً برای اولین تقاطع
      واقعی پایین‌دست هر پای ورودی؛ در سایر تقاطع‌ها jtrrouter از
      --turn-defaults 15,70,15 استفاده می‌کند. این اعداد حدس مهندسی خام‌اند و
      باید در فاز ۳ با شمارش گردش‌های واقعی (رجوع به §۵ برنامهٔ کالیبراسیون در
      CLAUDE.md) جایگزین شوند."
  left_turn_status_baseline:
    value: "free_informal_no_signage"
    unit: categorical
    source: observed
    range_low: null
    range_high: null
    sensitivity: false
    note: "تأیید کاربر در Checkpoint ۱ (۱۴۰۵/۰۶/۲۲): گردش به چپ زیر پل در وضع موجود
      ممنوعیت رسمی/تابلو ندارد؛ به‌صورت غیررسمی و آزاد (priority/weaving) انجام
      می‌شود. مدل S0 باید junction model را priority/right_before_left بگذارد،
      نه tls یا ممنوعیت گردش."

experiment_design:
  demand_scale_levels:
    value: [0.6, 0.8, 1.0, 1.2, 1.4]
    unit: fraction
    source: engineering_judgement
    range_low: null
    range_high: null
    sensitivity: false
    note: "ضریب مقیاس تقاضا λ طبق CLAUDE.md فاز ۳ — روی همهٔ سناریوها اجرا
      می‌شود تا نقطهٔ شکست هر گزینه و پایداری رتبه‌بندی در بازهٔ تقاضا مشخص شود."
  n_seeds_per_condition:
    value: 10
    unit: count
    source: engineering_judgement
    range_low: 10
    range_high: 30
    sensitivity: false
    note: "حداقل قاعدهٔ سخت ۵ پروژه؛ همان seed (۱..۱۰) هم به jtrrouter (برای
      تصادفی‌سازی انتساب گردش بر مبنای نسبت‌ها) و هم به sumo (برای تصادفی‌سازی
      رفتار تعقیب/تغییرخط، sigma) داده می‌شود تا هر seed یک تکرار مستقل و
      کاملاً قابل‌بازتولید باشد."
  global_sensitivity_factors:
    value:
      - {name: "demand_scale", low: 0.6, high: 1.4}
      - {name: "left_turn_share", low: 0.10, high: 0.25}
      - {name: "motorcycle_share", low: 0.15, high: 0.45}
      - {name: "tau_multiplier", low: 0.8, high: 1.2}
      - {name: "turning_radius_multiplier", low: 0.8, high: 1.2}
    unit: mixed
    source: engineering_judgement
    range_low: null
    range_high: null
    sensitivity: true
    note: "پنج عامل تحلیل حساسیت سراسری طبق CLAUDE.md فاز ۳ (§۴). طرح فعلی:
      عاملی کسری دوسطحی (۲^۵=۳۲ ترکیب) + ۵ seed هر ترکیب = ۱۶۰ اجرا برای S0؛
      اگر بودجهٔ محاسباتی فاز ۴ اجازه داد، به نمونه‌گیری Sobol روی همهٔ
      سناریوها ارتقا می‌یابد."


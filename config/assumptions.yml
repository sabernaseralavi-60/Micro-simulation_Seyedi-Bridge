# ثبت تمام فرض‌های ورودی مدل — فاز ۰
# قواعد پر کردن (CLAUDE.md §3.3):
#   value, unit, source (observed|osm|imagery|engineering_judgement|literature),
#   range_low, range_high, sensitivity (true|false)
#
# این فایل به‌مرور در فازهای ۱ تا ۴ تکمیل می‌شود. فیلدهای فاز ۰ فقط هندسه و bbox را پوشش می‌دهند.

study_area:
  intersection_name: "تقاطع زیرپل سیدی (بلوار سیدی × بزرگراه امام‌رضا)، کرمان"
  center_lon:
    value: 57.0850
    unit: degree_WGS84
    source: imagery
    range_low: 57.0830
    range_high: 57.0870
    sensitivity: true
    note: "میانگین مختصات نشانگر ماوس در ۵ اسکرین‌شات Google Earth؛ نیاز به راستی‌آزمایی با OSM/GPS میدانی."
  center_lat:
    value: 30.3165
    unit: degree_WGS84
    source: imagery
    range_low: 30.3155
    range_high: 30.3180
    sensitivity: true
    note: "همان منبع center_lon."
  bbox_half_extent:
    value: 400
    unit: meter
    source: engineering_judgement
    range_low: 400
    range_high: 600
    sensitivity: false
    note: "حداقل ۴۰۰ متر طبق قاعدهٔ CLAUDE.md فاز۰ برای جلوگیری از اثر لبه روی صف‌ها."

bridge_geometry:

  deck_lanes_per_direction:
    value: 3
    unit: count
    source: imagery
    range_low: 2
    range_high: 3
    sensitivity: true
    note: "برآورد چشمی از 2025_zoom.png؛ فاقد شمارش دقیق پیکسلی. **فاز ۲:** OSM
      این یال را ۲ خط در هر جهت ثبت کرده بود (source: osm) — پس از بازبینی
      دقیق‌تر 2025_zoom.png (ردیف خودروها به‌وضوح ۳تایی)، با اسکریپت
      src/02_patch_geometry.py روی plain-XML به ۳ خط اصلاح شد. این دقیقاً همان
      «فرض صریح + اصلاح برنامه‌نویسی‌شده به‌جای حدس پنهان یا ویرایش دستی
      netedit» است که قاعدهٔ سخت ۲ پروژه می‌خواهد."

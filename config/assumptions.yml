      واقعی پایین‌دست هر پای ورودی؛ در سایر تقاطع‌ها jtrrouter از
      --turn-defaults 15,70,15 استفاده می‌کند. این اعداد حدس مهندسی خام‌اند و
      باید در فاز ۳ با شمارش گردش‌های واقعی (رجوع به §۵ برنامهٔ کالیبراسیون در
      CLAUDE.md) جایگزین شوند."

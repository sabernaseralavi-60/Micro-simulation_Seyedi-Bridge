    note: "فاز ۲: تقاطع‌های ادغام (۲ ورودی/۱ خروجی) درون شعاع ۱۲۰ متری مرکز
      میدانچهٔ ویوینگ زیر پل، از priority (پیش‌فرض netconvert بر مبنای رتبهٔ
      کلاس راه) به zipper تغییر یافتند — طبق توصیهٔ صریح CLAUDE.md برای
      نمایش رفتار واقعی «هر که زودتر رسید» در نبود کانالیزاسیون/چراغ. اعمال
      شده در src/02_patch_geometry.py (۹ تقاطع). حساسیت: نوع junction model
      می‌تواند به‌طور محسوسی روی تأخیر و SSM اثر بگذارد؛ در فاز ۳ به‌عنوان
      متغیر حساسیت کاندید (priority در برابر zipper در برابر right_before_left)
      آزمایش شود."

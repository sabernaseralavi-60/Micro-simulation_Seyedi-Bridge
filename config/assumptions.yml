  span_structure:
    value:
      total_spans: 7
      layout_west_to_east: ["closed", "open", "open", "closed_center", "open", "open", "closed"]
      spans_per_side: 3
      open_spans_per_side: 2
      closed_spans_per_side: 1
      open_span_position: "دو دهانهٔ نزدیک‌تر به مرکز، از هر سمت (همهٔ دهانه‌های هر سمت به‌جز دهانهٔ انتهایی)"
      closed_span_position: "فقط دهانهٔ انتهایی/دورترین از مرکز، از هر سمت"
      closed_span_role: "جزو بدنهٔ سازه‌ای پل (دیوارهٔ توپر/کوله)، نه فضای قابل‌عبور"
      center_span_status_baseline: "بسته (عمدی)"
    unit: categorical
    source: observed
    range_low: null
    range_high: null
    sensitivity: true
    note: "**تصحیح‌شده در نشست جاری (۱۴۰۵/۰۶/۲۴)** — نسخهٔ قبلی این فیلد
      (۳ دهانهٔ هر سمت: فقط ۱ باز نزدیک مرکز، ۲ بسته دور) نادرست بود؛ کاربر
      مستقیماً تصحیح کرد و با مدرک تصویری تازه (کاربر: `data/raw/imagery/
      Seyedi Bridge.pdf`، صفحهٔ ۱ — همان تصویر ساخت ۲۰۱۲ با سه برچسب صریح
      closed/Closed-but-can-be-opened/closed روی ردیف پایه‌ها) تأیید شد:
      **فقط دهانهٔ انتهایی (دورترین از مرکز) هر سمت بسته است؛ دو دهانهٔ
      دیگر هر سمت (شامل دهانهٔ مجاور مرکز) باز و قابل‌عبورند.** یعنی زیر
      پل در طول محور شرقی-غربی به ۷ دهانه تقسیم می‌شود (۳ سمت غرب + ۱
      مرکزی + ۳ سمت شرق)، اما فضای بازِ واقعی به‌مراتب بیشتر از فرض قبلی
      است: هر سمت یک ناحیهٔ باز **دو-دهانه‌ای** دارد (نه یک گلوگاه
      تک‌دهانه‌ای)، جدا از سمت مقابل فقط با دهانهٔ مرکزی بسته. دهانهٔ
      مرکزی در وضع موجود عمداً بسته نگه داشته شده اما قابل‌بازشدن در
      سناریوهاست. **پیامد مدل‌سازی:** ناحیهٔ ویوینگ زیر پل دو ناحیهٔ باز
      نسبتاً پهن (هرکدام ~۲ دهانه) دارد که با یک بستر بستهٔ سازه‌ای در
      وسط از هم جدا مانده‌اند — نه «دو گلوگاه تک‌دهانه‌ای» که قبلاً فرض
      می‌شد. **بدون تغییر:** این هنوز به معنای یک میدانچهٔ باز پیوسته
      نیست (مرکز همچنان بسته است)، و مهم‌تر، **این تصحیح صرفاً توصیفی/
      مستندسازی است، نه تغییر توپولوژی SUMO** — شبکهٔ SUMO از OSM واقعی
      ساخته شده (نه از این فرض دهانه‌ها) و یال/لِین‌هایش دقیقاً همان‌جایی
      هستند که آسفالت واقعی وجود دارد؛ رجوع به یادداشت راستی‌آزمایی زیر.
      **پیامد سناریو:** باز کردن دهانهٔ مرکزی (به شرط تأیید ظرفیت باربری
      سازه — خارج از محدودهٔ این مطالعهٔ ترافیکی) همچنان یک گزینهٔ صریح
      برای S3/S5 است. هندسهٔ SUMO (شبکه + اسکچ) باید همیشه با این محدودیت
      فیزیکی سازگار بماند: هیچ لِین/یال قابل‌عبوری نباید از دل دهانهٔ
      انتهاییِ بسته یا دهانهٔ مرکزی عبور کند.
      **راستی‌آزمایی توپولوژی (این تصحیح):** بررسی مستقیم کد نشان داد این
      فیلد فقط در `src/00_geometry_sketch.py` (اسکچ) و docstring
      `scenarios/S3_roundabout/build_network.py` استفاده می‌شود — هیچ
      اسکریپت ساخت شبکه‌ای (S1-S5) مستقیماً از این عدد برای تصمیم توپولوژیک
      واقعی استفاده نکرده؛ همه از گره‌ها/یال‌های واقعی OSM (RING_NODES،
      TAP_IN/OUT، گره‌های merge/diverge) کار می‌کنند که از قبل درست‌اند.
      پس این تصحیح شبکهٔ SUMO موجود را نامعتبر نمی‌کند؛ فقط توضیح/تفسیر
      (اسکچ + روایت گزارش دربارهٔ «چرا این‌جا مثل شبه‌میدان رفتار می‌کند»)
      باید به‌روز شود — رجوع به `docs/imagery_review.md` هم برای همسویی."


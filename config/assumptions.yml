scenario_design_S5:
  note: "فاز ۴، نشست‌های ۴ و ۵ — دو دور رفع هندسی/کنترلی S5 (رجوع به
    scenarios/S5_hybrid/README.md برای شرح کامل). سه تصمیم طراحی جداگانه،
    هرکدام با روش مستند: (۱) شعاع تقاطع بای‌پس oneway_priority، طبق
    پیشنهاد مستقیم netconvert برای رفع هشدار «Intersecting left turns»؛
    (۲) سیکل چراغ متردهندهٔ metering، با جست‌وجوی تجربی سبک
    (tune_metering_cycle.py)؛ (۳) اولویت بای‌پس oneway_yield، آزمون مستقیم
    فرضیهٔ «حذف حق‌تقدم بدون‌قیدوشرط کمک می‌کند». **نتیجهٔ صادقانهٔ هر دو
    رفع بای‌پس، منفی بود**: رفع شعاع (۱) هشدار را کاملاً حذف کرد اما بهبود
    قابل‌اتکایی در نتیجهٔ شبیه‌سازی نداد (در λ=۱.۴ میانگین تأخیر بدتر شد،
    با ریسک دنبالهٔ بالا — ۱ از ۱۰ seed به ۶۰۰۹ برخورد در یک اجرا رسید).
    کاهش اولویت (۳) هم کمکی نکرد — بلکه ریسک دنبالهٔ نادر را به ضعف
    یکنواخت و معنی‌دار در هر ۱۰ seed تبدیل کرد (λ=۱.۴: ۱۵۲۶.۵ برخورد
    میانگین). یک چراغ راهنمایی واقعی (۴) — طراحی‌شده با src/10_signal_design.py
    و سیکل وبستر مخصوص این گره (رجوع به signal_design_S5_bypass) — نتیجهٔ
    این تلاش‌ها را نبست، **بدترین** کرد: λ=۱.۴، ۳۲۵۷.۶ برخورد میانگین —
    بدترین عدد کل این مطالعه، بیشتر حتی از بدترین حالت S1. سه تلاش هم‌سطح
    (هندسه، حق‌تقدم، چراغ) اکنون رد شده‌اند؛ نتیجه‌گیری: این نقطه با کنترل
    هم‌سطح از هر نوع قابل‌حل نیست. رجوع به گزارش بخش ۷ (مکانیزم ۵)."

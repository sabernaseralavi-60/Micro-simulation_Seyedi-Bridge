    unit: count
    source: imagery
    range_low: 1
    range_high: 2
    sensitivity: true
    note: "بلوار سیدی زیر پل، برآورد چشمی از 2017.png و 2025_zoom.png."
  span_width_between_abutments:
    value: 26
    unit: meter
    source: imagery
    range_low: 20
    range_high: 32
    sensitivity: true
    note: "برآورد پیکسلی از سایهٔ عرشه در 2025_zoom.png، غیرمتریک — نیازمند راستی‌آزمایی OSM/میدانی."
  loop_ramp_radius_nw:
    value: 30
    unit: meter
    source: imagery
    range_low: 20
    range_high: 40
    sensitivity: true
    note: "رمپ حلقوی شمال‌غربی، برآورد چشمی نسبت به عرض خط (۳.۵ متر)."
  loop_ramp_radius_ne:
    value: 30
    unit: meter
    source: imagery
    range_low: 20
    range_high: 40
    sensitivity: true
  weave_area_south_radius:
    value: 22
    unit: meter
    source: imagery
    range_low: 15
    range_high: 30
    sensitivity: true
    note: "انحنای جنوبی حول جزیرهٔ قطره‌ای، زیر پل."
  pier_offset_from_carriageway_edge:

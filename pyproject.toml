[project]
name = "seyedi-bridge-study"
version = "0.1.0"
description = "Traffic re-organization study for the Seyedi under-bridge intersection, Kerman, Iran"
requires-python = ">=3.11,<3.14"
dependencies = [
    "eclipse-sumo==1.27.1",
    "sumolib==1.27.1",
    "traci==1.27.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "SALib>=1.5",
    "optuna==4.9.0",
    "jupyter>=1.0",
    "tabulate>=0.9",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
